apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api
  labels:
    app: heart-disease-api
spec:
  type: LoadBalancer      # Minikube: run `minikube tunnel`; Docker Desktop exposes localhost directly
  selector:
    app: heart-disease-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
